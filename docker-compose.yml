services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: receiptless
      POSTGRES_PASSWORD: receiptless
      POSTGRES_DB: receiptless
    ports:
      # 5433, not Postgres's default 5432 — IDent's own docker-compose.yml
      # already binds 5432 on the same dev machine, and the two projects
      # are meant to run side by side, not take turns.
      - "5433:5432"
    volumes:
      - receiptless_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receiptless"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Session 4 (RECEIPTLESS_STATE.md): S3-compatible local target for real
  # object storage — src/lib/storage.ts talks to it via the S3 API (same
  # client works against real S3/R2 later, purely via env vars). Local dev
  # only; not used in CI, which runs against an injectable in-memory fake
  # instead (src/test/fake-object-storage.ts) to avoid depending on a
  # service container that isn't part of this repo's existing CI setup.
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: receiptless
      MINIO_ROOT_PASSWORD: receiptless-dev-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - receiptless_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Session 5 follow-up (RECEIPTLESS_STATE.md, 2026-08-12): self-hosted
  # Surya OCR service — src/lib/ocr-client.ts talks to it over HTTP. Not
  # used in CI, which runs against an injectable in-memory fake instead
  # (src/test/fake-ocr-client.ts), same convention as the minio service
  # above: real OCR is exercised manually against this container, not
  # wired into the automated test suite. PaddleOCR was tried first
  # (same day) — dropped after its official binaries crashed under both
  # native arm64 and emulated amd64 on this machine; Surya is PyTorch-based
  # and doesn't hit that class of problem, so this runs native arm64.
  ocr:
    build: ./ocr-service
    # Loopback-only, not 0.0.0.0 — the Python service itself has no auth
    # (POST /api/receipts/ocr's session check is the only gate, in
    # Next.js), so publishing this on all interfaces would let anyone who
    # can reach the machine bypass that gate entirely and trigger
    # unauthenticated, unmetered OCR work (1-3 minutes of CPU each, per
    # RECEIPTLESS_STATE.md's Session 5 follow-up timing). Flagged in a real
    # review 2026-08-12; fixed same day. A real production deployment needs
    # this on a private network with no public port at all, not just
    # loopback — see RECEIPTLESS_STATE.md for the full list of what a real
    # deploy still needs (auth/rate-limits on the service itself, async job
    # queue instead of a long-held HTTP request, etc.).
    ports:
      - "127.0.0.1:8868:8868"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8868/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s # model loading at startup can take a while on first boot

volumes:
  receiptless_db_data:
  receiptless_minio_data:
