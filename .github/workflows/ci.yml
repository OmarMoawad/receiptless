name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: receiptless
          POSTGRES_PASSWORD: receiptless
          POSTGRES_DB: receiptless
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U receiptless"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://receiptless:receiptless@localhost:5432/receiptless
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      # Must run before typecheck/build/test: generates @/generated/prisma
      # (the Prisma client's own types), which nothing in this repo commits.
      - run: npm run db:generate

      - run: npm run db:migrate

      # Rollback safety: DEPLOYMENT.md §7's recovery procedure is
      # "promote the last good deployment", which only works if the
      # previous release's code still runs against the current schema.
      # Checked here so a destructive migration is caught at PR time
      # rather than discovered during an incident.
      - run: npm run check:migrations

      - run: npm run test

      # Lint gates CI as of 2026-08-15. It did not before, which is how a
      # react-hooks/set-state-in-effect error reached production in
      # GmailConnections.tsx. `npm run lint` was also reporting 729 errors
      # from the generated Prisma client and agent worktrees, so the signal
      # was useless and ignoring it was rational — both are now excluded in
      # eslint.config.mjs, and the remaining output is small enough to gate on.
      - run: npm run lint

      # Must run before typecheck: Next.js generates its own ambient types
      # (.next/types — e.g. layout.tsx's LayoutProps) as a side effect of
      # building, and nothing commits those either. `next build` runs its
      # own internal type-check too, so this ordering means a type error
      # surfaces here first either way — the standalone typecheck step
      # below is still worth keeping since it also covers *.test.ts files,
      # which next build's internal check does not.
      - run: npm run build

      - run: npm run typecheck
