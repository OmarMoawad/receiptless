name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: receiptless
          POSTGRES_PASSWORD: receiptless
          POSTGRES_DB: receiptless
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U receiptless"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://receiptless:receiptless@localhost:5432/receiptless
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run typecheck

      - run: npm run db:generate

      - run: npm run db:migrate

      - run: npm run test

      - run: npm run build
